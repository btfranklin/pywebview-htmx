name: Upload Python Package

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    validate:
        uses: ./.github/workflows/python-package.yml

    publish:
        needs: validate
        runs-on: ubuntu-latest
        environment: release
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: python-distributions
                  path: dist/
            - name: Publish checked distributions with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@release/v1
